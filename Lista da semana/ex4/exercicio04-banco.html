<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Infinity Bank</title>
  <link rel="stylesheet" href="style4.css">
</head>
<body>
  <div class="container">
    <h2>Infinity Bank</h2>

    <label>Bandeira do Cartão:</label>
    <select id="bandeira">
      <option value="visa">Visa (2%)</option>
      <option value="master">Master (1,85%)</option>
      <option value="elo">Elo (3%)</option>
    </select>

    <label>Valor da Venda (R$):</label>
    <input type="number" id="valor" step="0.01" placeholder="Ex: 500.00">

    <label>Número de Parcelas:</label>
    <select id="parcelas">
      <option value="1">1x</option>
      <option value="2">2x</option>
      <option value="3">3x</option>
      <option value="4">4x</option>
      <option value="5">5x</option>
      <option value="6">6x</option>
      <option value="7">7x</option>
      <option value="8">8x</option>
      <option value="9">9x</option>
      <option value="10">10x</option>
      <option value="11">11x</option>
      <option value="12">12x</option>
    </select>

    <button onclick="calcular()">Calcular</button>

    <div id="resultado"></div>
  </div>

  <script src="banco.js"></script>
</body>
</html>
